<!doctype html>
<html lang="zh-CN" class="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>流体玻璃 · 布局验证</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body data-codex-glass-fixture>
  <svg class="icon-definitions" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <symbol id="i-arrow-left" viewBox="0 0 24 24"><path d="M20 12H4m7-7-7 7 7 7"/></symbol>
      <symbol id="i-arrow-right" viewBox="0 0 24 24"><path d="M4 12h16m-7-7 7 7-7 7"/></symbol>
      <symbol id="i-sidebar" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></symbol>
      <symbol id="i-home" viewBox="0 0 24 24"><path d="m3 10 9-8 9 8v11h-6v-7H9v7H3Z"/></symbol>
      <symbol id="i-chats" viewBox="0 0 24 24"><path d="M5 5h12a3 3 0 0 1 3 3v8a3 3 0 0 1-3 3H9l-4 3v-5H4a3 3 0 0 1-3-3V8a3 3 0 0 1 3-3Z"/><path d="m7 5 1-3 13 3 1 10-2 1"/></symbol>
      <symbol id="i-history" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 6v7l-4 2"/></symbol>
      <symbol id="i-at" viewBox="0 0 24 24"><circle cx="11" cy="12" r="4"/><path d="M15 8v7c0 3 6 2 6-4a9 9 0 1 0-4 8"/></symbol>
      <symbol id="i-more" viewBox="0 0 24 24"><circle cx="4" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="20" cy="12" r="1"/></symbol>
      <symbol id="i-branch" viewBox="0 0 24 24"><circle cx="6" cy="5" r="2"/><circle cx="6" cy="19" r="2"/><circle cx="18" cy="5" r="2"/><path d="M6 7v10m12-10v3c0 4-12 0-12 4"/></symbol>
      <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
      <symbol id="i-bell" viewBox="0 0 24 24"><path d="M6 9a6 6 0 0 1 12 0v5l3 3H3l3-3Zm4 11h4"/></symbol>
      <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10" cy="10" r="7"/><path d="m15 15 6 6"/></symbol>
      <symbol id="i-new-chat" viewBox="0 0 24 24"><path d="M11 4H6a3 3 0 0 0-3 3v11a3 3 0 0 0 3 3h11a3 3 0 0 0 3-3v-5m-8 2 2-5 7-7 3 3-7 7Z"/></symbol>
      <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7V5a2 2 0 0 1 2-2h5l3 3h6a2 2 0 0 1 2 2v2M3 7h16a2 2 0 0 1 2 3l-3 10H2L1 10a2 2 0 0 1 2-3Z"/></symbol>
      <symbol id="i-panel" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M15 4v16"/></symbol>
      <symbol id="i-terminal" viewBox="0 0 24 24"><path d="m4 6 6 6-6 6m9 0h7"/></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 4v16M4 12h16"/></symbol>
      <symbol id="i-mic" viewBox="0 0 24 24"><rect x="8" y="2" width="8" height="13" rx="4"/><path d="M5 11v2a7 7 0 0 0 14 0v-2m-7 9v2"/></symbol>
      <symbol id="i-send" viewBox="0 0 24 24"><path d="M12 20V4m-6 6 6-6 6 6"/></symbol>
      <symbol id="i-shield" viewBox="0 0 24 24"><path d="m12 2 8 4v6c0 5-5 8-8 10-3-2-8-5-8-10V6Z"/><path d="M12 7v6m0 3h.01"/></symbol>
      <symbol id="i-bolt" viewBox="0 0 24 24"><path d="m13 2-9 12h7l-1 8 10-13h-8Z"/></symbol>
    </defs>
  </svg>
  <div id="root">
    <div class="fixture-window">
      <header class="window-menu" data-fixture-layout="window-menu">
        <div class="window-navigation">
          <button class="icon-button" type="button" aria-label="后退"><svg class="icon"><use href="#i-arrow-left"/></svg></button>
          <button class="icon-button inactive" type="button" aria-label="前进"><svg class="icon"><use href="#i-arrow-right"/></svg></button>
          <button class="icon-button" type="button" aria-label="切换侧边栏"><svg class="icon"><use href="#i-sidebar"/></svg></button>
        </div>
        <nav class="menu-items" aria-label="应用菜单"><button type="button">文件</button><button type="button">编辑</button><button type="button">视图</button><button type="button">帮助</button></nav>
        <div class="fixture-tools"><button class="fixture-settings" id="show-app-settings" type="button">设置页示例</button><button class="fixture-settings" id="open-settings" type="button">皮肤设置 · 验证工具</button></div>
      </header>
      <div data-app-shell-frame data-fixture-layout="shell">
        <nav class="app-rail" aria-label="应用功能" data-fixture-layout="app-rail">
          <button class="rail-button selected" type="button" aria-label="主页"><svg class="icon filled"><use href="#i-home"/></svg></button>
          <button class="rail-button" type="button" aria-label="聊天"><svg class="icon"><use href="#i-chats"/></svg></button>
          <button class="rail-button" type="button" aria-label="历史"><svg class="icon"><use href="#i-history"/></svg></button>
          <button class="rail-button" type="button" aria-label="提及"><svg class="icon"><use href="#i-at"/></svg></button>
          <button class="rail-button" type="button" aria-label="更多"><svg class="icon"><use href="#i-more"/></svg><span class="notification-dot"></span></button>
          <div class="rail-divider"></div>
          <button class="rail-button" type="button" aria-label="代码仓库"><svg class="icon"><use href="#i-branch"/></svg></button>
          <button class="account-button" type="button" aria-label="账号" data-fixture-layout="account">S</button>
        </nav>
        <aside data-app-shell-left-panel-appearance="inset" data-fixture-layout="sidebar">
          <nav data-slate-sidebar-content aria-label="Codex 侧栏">
            <div class="sidebar-toolbar" data-fixture-layout="sidebar-toolbar">
              <button class="codex-switcher" type="button">Codex <svg class="icon"><use href="#i-chevron"/></svg></button>
              <button class="icon-button" type="button" aria-label="通知"><svg class="icon"><use href="#i-bell"/></svg></button>
              <button class="icon-button" type="button" aria-label="搜索"><svg class="icon"><use href="#i-search"/></svg></button>
            </div>
            <div class="sidebar-actions" data-fixture-layout="sidebar-actions">
              <button class="sidebar-action" type="button"><svg class="icon"><use href="#i-new-chat"/></svg><span>新聊天</span></button>
              <button class="sidebar-action" type="button"><span class="dot-avatar" aria-hidden="true">🔵</span><span>Your dot</span></button>
            </div>
            <div class="project-list" data-fixture-layout="project-list">
              <h2 class="nav-caption">项目</h2>
              <section class="project-group">
                <button class="project-row" type="button"><svg class="icon"><use href="#i-folder"/></svg><span>示例项目</span></button>
                <button class="chat-row active" type="button" aria-current="page">皮肤布局验证</button>
                <button class="chat-row" type="button">检查项目结构</button>
              </section>
              <section class="project-group">
                <button class="project-row" type="button"><svg class="icon"><use href="#i-folder"/></svg><span>代码项目</span></button>
                <button class="chat-row" type="button">审阅代码变更<span class="chat-status" aria-hidden="true">●</span></button>
                <button class="chat-row" type="button">运行项目检查</button>
                <button class="chat-row" type="button">说明启动流程</button>
              </section>
              <section class="project-group">
                <button class="project-row" type="button"><svg class="icon"><use href="#i-folder"/></svg><span>文档工作区</span></button>
                <button class="chat-row" type="button">整理使用说明</button>
                <button class="chat-row" type="button">核对文档内容</button>
              </section>
            </div>
          </nav>
        </aside>
        <main data-app-shell-main-surface="default" data-fixture-layout="main">
          <div data-app-shell-main-content-layout>
            <header class="chat-header" data-fixture-layout="chat-header">
              <div class="chat-heading"><span class="chat-project">示例项目</span><h1>皮肤布局验证</h1></div>
              <span class="validation-caption">布局验证页 · 非真实 Codex</span>
              <div class="chat-header-tools">
                <button class="icon-button" type="button" aria-label="终端"><svg class="icon"><use href="#i-terminal"/></svg></button>
                <button class="icon-button" type="button" aria-label="打开右侧面板"><svg class="icon"><use href="#i-panel"/></svg></button>
              </div>
            </header>
            <div class="conversation-scroll" data-fixture-layout="conversation">
              <div class="conversation-content">
                <div class="user-message">保持侧栏、聊天区和底部输入框原来的位置，只改变皮肤。</div>
                <article class="assistant-message">
                  <p>这里是聊天页的布局验证示意。</p>
                  <p>流动背景放在界面底层，原有菜单、项目列表、聊天内容和输入框继续占据原来的区域。中央装饰使用蓝白鲨鱼粒子，输入框仍在聊天区底部。</p>
                  <p class="quiet">示例项目和对话用于验证布局，不代表实际 Codex 已接入皮肤。</p>
                </article>
              </div>
            </div>
            <div class="composer-dock" data-thread-scroll-footer="true" data-fixture-layout="composer-dock">
              <div class="pointer-events-none bg-surface fixture-footer-scrim" aria-hidden="true"></div>
              <div data-codex-composer-root data-above-composer-conversation-id="fixture-chat-a" data-composer-placement="thread" data-fixture-layout="composer">
                <div class="composer-frame-stack">
                <div data-composer-layout="multiline" data-composer-padding-variant="none" data-composer-radius-variant="default" data-composer-surface-variant="default">
                  <div data-composer-body>
                  <textarea class="composer-input" aria-label="消息输入" placeholder="随心输入"></textarea>
                  <div class="composer-tools" data-composer-footer data-fixture-layout="composer-tools">
                    <button class="icon-button" type="button" aria-label="添加附件"><svg class="icon"><use href="#i-plus"/></svg></button>
                    <button class="permission-picker" type="button"><svg class="icon"><use href="#i-shield"/></svg>完全访问</button>
                    <span class="composer-spacer"></span>
                    <button class="model-picker" type="button"><svg class="icon filled"><use href="#i-bolt"/></svg>GPT-6.1 Sol <span class="model-effort">Max</span><svg class="icon"><use href="#i-chevron"/></svg></button>
                    <button class="icon-button" type="button" aria-label="语音输入"><svg class="icon"><use href="#i-mic"/></svg></button>
                    <button class="send-button" type="button" aria-label="发送"><svg class="icon"><use href="#i-send"/></svg></button>
                  </div>
                  </div>
                </div>
                </div>
              </div>
            </div>
          </div>
        </main>
      </div>
    </div>
  </div>
  <template id="settings-page-template">
    <div class="settings-content bg-surface" data-app-shell-main-content-layout>
      <div class="settings-column group/settings" data-density="default">
        <h1>常规</h1>
        <h2>偏好</h2>
        <section class="settings-card rounded-2xl border bg-surface" data-settings-card>
          <div class="settings-row"><div><strong>通知</strong><p>任务完成时显示通知。</p></div><input type="checkbox" aria-label="通知" checked></div>
          <div class="settings-row"><div><strong>底部面板</strong><p>在应用底部显示工作区面板。</p></div><input type="checkbox" aria-label="底部面板" checked></div>
        </section>
        <h2>工作区</h2>
        <section class="settings-card rounded-2xl border bg-surface" data-settings-card>
          <div class="settings-row"><strong>默认文件打开位置</strong><button type="button">编辑器 <svg class="icon"><use href="#i-chevron"/></svg></button></div>
          <div class="settings-row"><strong>集成终端</strong><button type="button">PowerShell <svg class="icon"><use href="#i-chevron"/></svg></button></div>
          <div class="settings-row"><strong>语言</strong><button type="button">自动检测 <svg class="icon"><use href="#i-chevron"/></svg></button></div>
        </section>
        <p class="settings-example-note">设置布局示例；这里的控件仅供本地视觉检查。</p>
      </div>
    </div>
  </template>
  <template id="settings-sidebar-template">
    <h2 class="settings-sidebar-title">设置</h2>
    <input id="settings-search" class="settings-search" type="search" aria-label="搜索设置" placeholder="搜索">
    <div class="settings-nav"><span class="nav-caption">个人</span><button type="button" class="active">常规</button><button type="button">通知</button><button type="button">外观</button><button type="button">语言</button><button type="button">键盘快捷键</button><span class="nav-caption">集成</span><button type="button">插件</button><button type="button">浏览器</button></div>
  </template>
  <div id="runtime-error" role="alert" hidden></div>
  <script src="/skin.js"></script>
  <script src="/app.js"></script>
</body>
</html>
